name: Deploy

# Every push to main deploys, once CI has passed for that commit (a push that fails CI is
# never deployed). "Run workflow" redeploys main by hand.
#
# Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, and optionally VPS_KNOWN_HOSTS
#            (`ssh-keyscan -H <host>` output; without it the host key is trusted on first use
#            in each run).
# Variables: APP_DOMAIN (for the health check), optionally VITE_SENTRY_DSN.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: santa-api (API and worker)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: santa-web (Caddy + PWA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            APP_VERSION=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-web:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to the VPS
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      IMAGE_TAG: ${{ needs.images.outputs.sha }}
      GHCR_OWNER: ${{ needs.images.outputs.owner }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.sha }}

      - name: Check configuration
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing secret:VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing secret:VPS_USER"
          [ -n "$APP_DOMAIN" ] || missing="$missing variable:APP_DOMAIN"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      # The server we deploy to must be the one the domain points at; otherwise the deploy
      # "succeeds" on one machine while visitors keep getting the old site from another.
      - name: VPS_HOST is the server behind APP_DOMAIN
        run: |
          host_ips="$(getent ahostsv4 "$VPS_HOST" | awk '{print $1}' | sort -u | paste -sd ' ')"
          domain_ips="$(getent ahostsv4 "$APP_DOMAIN" | awk '{print $1}' | sort -u | paste -sd ' ')"
          echo "VPS_HOST ($VPS_HOST) -> ${host_ips:-nothing}"
          echo "APP_DOMAIN ($APP_DOMAIN) -> ${domain_ips:-nothing}"
          if [ -z "$host_ips" ] || [ "$host_ips" != "$domain_ips" ]; then
            echo "::error::VPS_HOST resolves to '${host_ips}', but $APP_DOMAIN resolves to '${domain_ips}'. Set the VPS_HOST secret to $APP_DOMAIN (or its IP)."
            exit 1
          fi

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the compose file and backup script
        run: scp infra/docker-compose.yml infra/backup/backup.sh vps:/opt/santa/

      - name: Log the server in to GHCR (for private images)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # The job's token expires when the job ends; the server logs out after pulling.
        run: printf '%s' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull, migrate, start
        run: |
          set -o pipefail
          ssh vps "IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER bash -s" <<'EOF' | tee "$RUNNER_TEMP/deploy.log"
          set -euo pipefail
          cd /opt/santa
          trap 'docker logout ghcr.io >/dev/null' EXIT

          # Settings the stack can't run without. Without APP_DOMAIN, Caddy only serves
          # "localhost" and HTTPS breaks for everyone; APP_BASE_URL drives sign-in.
          for key in APP_DOMAIN APP_BASE_URL; do
            if ! grep -Eq "^${key}=.+" .env; then
              echo "::error::/opt/santa/.env has no ${key}"
              exit 1
            fi
          done

          # This commit's images, pulled explicitly so a failed pull fails the deploy.
          # (`docker compose pull` only warns for services that also have a build: section,
          # and `up -d` then keeps the old containers: the deploy "succeeds" without updating.)
          api="ghcr.io/${GHCR_OWNER}/santa-api:${IMAGE_TAG}"
          web="ghcr.io/${GHCR_OWNER}/santa-web:${IMAGE_TAG}"
          docker pull "$api"
          docker pull "$web"
          docker compose pull postgres redis

          # -T and </dev/null: this script itself arrives on stdin (`bash -s`). Without them,
          # `compose run` hands that stdin to the container, which swallows the rest of the
          # script: bash then exits 0 right after the migration and nothing below ever runs.
          docker compose run --rm -T api alembic upgrade head </dev/null
          docker compose up -d --no-build --remove-orphans </dev/null

          # Every app container must now run this commit's image.
          for service in caddy api worker; do
            running="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q "$service")")"
            if [ "$service" = caddy ]; then want="$web"; else want="$api"; fi
            if [ "$running" != "$want" ]; then
              echo "::error::$service runs $running, expected $want"
              exit 1
            fi
          done

          # This machine itself must now serve this commit (bypassing DNS): if it doesn't,
          # something other than this compose project answers on 80/443 here.
          echo "Deployed on $(hostname): $(hostname -I)"
          domain="$(grep -E '^APP_DOMAIN=' .env | tail -n 1 | cut -d= -f2- | tr -d "\"' \r")"
          served=""
          for attempt in $(seq 1 15); do
            served="$(curl -sk --max-time 5 --resolve "$domain:443:127.0.0.1" "https://$domain/version.txt" || true)"
            [ "$served" = "$IMAGE_TAG" ] && break
            sleep 2
          done
          if [ "$served" != "$IMAGE_TAG" ]; then
            echo "::error::$(hostname) serves '$(printf '%.60s' "$served")' locally, expected $IMAGE_TAG"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'
            exit 1
          fi

          docker image prune -f
          docker compose ps
          echo "DEPLOY_SCRIPT_COMPLETE $IMAGE_TAG"
          EOF
          # A script cut short (stdin swallowed, connection dropped) can still exit 0: only
          # trust a run that reached its last line.
          if ! grep -qx "DEPLOY_SCRIPT_COMPLETE $IMAGE_TAG" "$RUNNER_TEMP/deploy.log"; then
            echo "::error::The deploy script on the server stopped before its end; see the log above."
            exit 1
          fi

      - name: Health check
        run: |
          curl -fsS --retry 20 --retry-delay 6 --retry-all-errors --max-time 10 \
            "https://$APP_DOMAIN/api/v1/health"

      # The live site must serve this commit's build (frontend/Dockerfile writes version.txt).
      - name: The site serves this commit
        run: |
          live=""
          for attempt in $(seq 1 20); do
            live="$(curl -fsS --max-time 10 "https://$APP_DOMAIN/version.txt" || true)"
            if [ "$live" = "$IMAGE_TAG" ]; then
              echo "https://$APP_DOMAIN serves $IMAGE_TAG"
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://$APP_DOMAIN serves '${live:-nothing}', expected $IMAGE_TAG"
          exit 1
