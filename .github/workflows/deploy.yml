name: Deploy

# Every push to main deploys, once CI has passed for that commit (a push that fails CI is
# never deployed). "Run workflow" redeploys main by hand.
#
# Secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, and optionally VPS_KNOWN_HOSTS
#            (`ssh-keyscan -H <host>` output; without it the host key is trusted on first use
#            in each run).
# Variables: APP_DOMAIN (for the health check), optionally VITE_SENTRY_DSN.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image names
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: santa-api (API and worker)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: santa-web (Caddy + PWA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-web:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/santa-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to the VPS
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      IMAGE_TAG: ${{ needs.images.outputs.sha }}
      GHCR_OWNER: ${{ needs.images.outputs.owner }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.sha }}

      - name: Check configuration
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing secret:VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing secret:VPS_USER"
          [ -n "$APP_DOMAIN" ] || missing="$missing variable:APP_DOMAIN"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy the compose file and backup script
        run: scp infra/docker-compose.yml infra/backup/backup.sh vps:/opt/santa/

      - name: Log the server in to GHCR (for private images)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # The job's token expires when the job ends; the server logs out after pulling.
        run: printf '%s' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull, migrate, start
        run: |
          ssh vps "IMAGE_TAG=$IMAGE_TAG GHCR_OWNER=$GHCR_OWNER bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/santa
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker compose pull
          docker compose run --rm api alembic upgrade head
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          EOF

      - name: Health check
        run: |
          curl -fsS --retry 20 --retry-delay 6 --retry-all-errors --max-time 10 \
            "https://$APP_DOMAIN/api/v1/health"
