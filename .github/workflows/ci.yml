name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa
          POSTGRES_DB: santa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santa -d santa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://santa:santa@127.0.0.1:5432/santa
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Design and i18n audit
        run: pnpm audit:design

      - name: Vitest
        run: pnpm test

      - name: Build (fails if the initial JS is over 250 KB gzipped)
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    # Only on pushes to main, after both apps pass (CLAUDE.md §10). Deploy waits for CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa
          POSTGRES_DB: santa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santa -d santa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: "true"
      # tests.e2e_server derives santa_e2e / Redis DB 14 / bucket secret-santa-e2e from these.
      DATABASE_URL: postgresql+asyncpg://santa:santa@127.0.0.1:5432/santa
      REDIS_URL: redis://127.0.0.1:6379/0
      E2E_S3_ACCESS_KEY_ID: e2e-minio
      E2E_S3_SECRET_ACCESS_KEY: e2e-minio-secret

    steps:
      - uses: actions/checkout@v4

      # MinIO's own images (quay.io/minio, Docker Hub minio/minio) now require auth, so CI
      # uses Bitnami's frozen MinIO build, which pulls anonymously. It starts the server by
      # itself (no `server /data` command) and has the same env vars, port and health check.
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$E2E_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$E2E_S3_SECRET_ACCESS_KEY" \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (es/en × mobile/desktop)
        working-directory: frontend
        run: pnpm e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
