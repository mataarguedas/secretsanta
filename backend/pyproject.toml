[project]
name = "santa-backend"
version = "0.1.0"
description = "Secret Santa API and worker"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "authlib>=1.3",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "pywebpush>=2.0",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "boto3>=1.35",
    "arq>=0.26",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.19",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
]

[tool.uv]
package = false

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM", "PT", "RUF", "DTZ",
]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults is idiomatic
]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make isort treat the library as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# ── mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pywebpush.*", "slowapi.*", "pillow_heif.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/settings.py"]
