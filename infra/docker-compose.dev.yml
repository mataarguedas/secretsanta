# Development overrides. Use together with the base file:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d postgres redis minio minio-init
#
# Ports are bound to 127.0.0.1 only, so nothing is reachable from the LAN.
# MinIO stands in for Cloudflare R2. Its images are published on quay.io
# (MinIO no longer publishes to Docker Hub). The pinned release is the last one
# that ships the full admin console.

services:
  postgres:
    ports:
      # Override POSTGRES_HOST_PORT if a native Postgres already uses 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set in infra/.env}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the bucket (idempotent) and makes sure it is private.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${R2_ACCESS_KEY_ID}
      MINIO_PASSWORD: ${R2_SECRET_ACCESS_KEY}
      BUCKET: ${R2_BUCKET:-secret-santa}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$BUCKET"
        mc anonymous set none "local/$$BUCKET"
        echo "Bucket $$BUCKET ready (access: $$(mc anonymous get "local/$$BUCKET"))"

volumes:
  minio-data:
